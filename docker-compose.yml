services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_laravel_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - crud_network

  frontend:
    image: node:22
    container_name: crud_laravel_frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm run dev -- --host 0.0.0.0"
    networks:
      - crud_network

  mysql:
    image: mysql:8.0
    container_name: crud_laravel_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_manager
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task_password
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crud_network

volumes:
  mysql_data:

networks:
  crud_network:
    driver: bridge
